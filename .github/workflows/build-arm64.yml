name: Build arm64 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Apply thumbnail download fix
        run: |
          python3 - <<'EOF'
          helper = '''
          private fun String.isRemoteHttpUrl(): Boolean = startsWith(prefix = "http://", ignoreCase = true) ||
              startsWith(prefix = "https://", ignoreCase = true)
          '''
          edits = [
              (
                  "feature/playlist/src/main/java/dev/anilbeesetti/nextplayer/feature/playlist/screens/detail/PlaylistDetailScreen.kt",
                  ".data(data = item.tvgLogo ?: item.video?.uriString ?: item.uri)",
                  ".data(data = item.tvgLogo ?: item.video?.uriString ?: item.uri.takeUnless { it.isRemoteHttpUrl() })",
              ),
              (
                  "feature/player/src/main/java/dev/anilbeesetti/nextplayer/feature/player/ui/PlaylistView.kt",
                  ".data(mediaItem.mediaId)",
                  ".data(mediaItem.mediaId.takeUnless { it.isRemoteHttpUrl() })",
              ),
          ]
          for path, old, new in edits:
              s = open(path).read()
              if "isRemoteHttpUrl" in s:
                  print("already patched:", path)
                  continue
              assert s.count(old) == 1, "pattern not found in " + path
              s = s.replace(old, new).rstrip("\n") + "\n" + helper
              open(path, "w").write(s)
              print("patched:", path)
          EOF

      - name: Make playlist import robust
        run: |
          python3 - <<'EOF'
          path = "core/data/src/main/java/dev/anilbeesetti/nextplayer/core/data/playlist/M3UParser.kt"
          s = open(path).read()
          if "parseUrlOnce" in s:
              print("already patched:", path)
          else:
              edits = [
                  (
                      "import kotlinx.coroutines.coroutineScope\n",
                      "import kotlinx.coroutines.coroutineScope\nimport kotlinx.coroutines.delay\n",
                  ),
                  (
                      "    suspend fun parseUrl(url: String): Result<M3UPlaylist> = withContext(context = ioDispatcher) {\n",
                      "    suspend fun parseUrl(url: String): Result<M3UPlaylist> {\n"
                      "        var result = parseUrlOnce(url = url)\n"
                      "        var attempt = 1\n"
                      "        while (result.exceptionOrNull() is IOException && attempt < 4) {\n"
                      "            delay(timeMillis = 2_000L)\n"
                      "            result = parseUrlOnce(url = url)\n"
                      "            attempt++\n"
                      "        }\n"
                      "        return result\n"
                      "    }\n"
                      "\n"
                      "    private suspend fun parseUrlOnce(url: String): Result<M3UPlaylist> = withContext(context = ioDispatcher) {\n",
                  ),
                  (
                      "                connection.connectTimeout = NETWORK_TIMEOUT_MILLIS\n"
                      "                connection.readTimeout = NETWORK_TIMEOUT_MILLIS\n",
                      "                connection.connectTimeout = 20_000\n"
                      "                connection.readTimeout = 30_000\n",
                  ),
                  (
                      "    val gate = Semaphore(permits = 6)\n",
                      "    val deadline = System.currentTimeMillis() + TITLE_LOOKUP_BUDGET_MILLIS\n"
                      "    val gate = Semaphore(permits = 4)\n",
                  ),
                  (
                      "async { gate.withPermit { fetchRemoteFileName(link = link) } }",
                      "async {\n"
                      "                gate.withPermit {\n"
                      "                    if (System.currentTimeMillis() > deadline) null else fetchRemoteFileName(link = link)\n"
                      "                }\n"
                      "            }",
                  ),
                  (
                      "private const val FILE_NAME_TIMEOUT_MILLIS = 8_000\n",
                      "private const val FILE_NAME_TIMEOUT_MILLIS = 5_000\n"
                      "private const val TITLE_LOOKUP_BUDGET_MILLIS = 20_000L\n",
                  ),
              ]
              for old, new in edits:
                  assert s.count(old) == 1, "pattern not found: " + old[:60]
                  s = s.replace(old, new)
              open(path, "w").write(s)
              print("patched:", path)
          EOF

      - name: Allow short playlist IDs
        run: |
          python3 - <<'EOF'
          base = "feature/playlist/src/main/java/dev/anilbeesetti/nextplayer/feature/playlist/screens/list/"
          vm = base + "PlaylistListViewModel.kt"
          screen = base + "PlaylistListScreen.kt"
          s = open(vm).read()
          if "isDdStreamId" in s:
              print("already patched:", vm)
          else:
              old = "        if (linkedCreationJob?.isActive == true) return\n        val source = url.trim()\n"
              new = (
                  "        if (linkedCreationJob?.isActive == true) return\n"
                  "        val source = url.trim().let { if (it.isDdStreamId()) DD_STREAM_PLAYLIST_PREFIX + it else it }\n"
              )
              assert s.count(old) == 1, "pattern not found in " + vm
              s = s.replace(old, new).rstrip("\n") + "\n" + (
                  "\n"
                  "private const val DD_STREAM_PLAYLIST_PREFIX = \"https://ddstream.dpdns.org/playlist?path=\"\n"
                  "private val ddStreamIdRegex = Regex(pattern = \"[A-Za-z0-9]{20,}\")\n"
                  "\n"
                  "internal fun String.isDdStreamId(): Boolean = ddStreamIdRegex.matches(this)\n"
              )
              open(vm, "w").write(s)
              print("patched:", vm)
          s = open(screen).read()
          if "isDdStreamId" in s:
              print("already patched:", screen)
          else:
              old = "val isValid = remember(trimmedUrl) { trimmedUrl.isHttpUrl() }"
              new = "val isValid = remember(trimmedUrl) { trimmedUrl.isHttpUrl() || trimmedUrl.isDdStreamId() }"
              assert s.count(old) == 1, "pattern not found in " + screen
              open(screen, "w").write(s.replace(old, new))
              print("patched:", screen)
          EOF

      - name: Allow short stream IDs
        run: |
          python3 - <<'EOF'
          path = "feature/network/src/main/java/dev/anilbeesetti/nextplayer/feature/network/screens/list/NetworkScreen.kt"
          s = open(path).read()
          if "ddStreamDownloadPrefix" in s:
              print("already patched:", path)
          else:
              old = "onAction(NetworkAction.OpenStream(trimmedStreamUrl.toUri()))"
              new = (
                  "onAction(\n"
                  "                                NetworkAction.OpenStream(\n"
                  "                                    (\n"
                  "                                        if (Regex(\"[A-Za-z0-9]{20,}\").matches(trimmedStreamUrl)) {\n"
                  "                                            ddStreamDownloadPrefix + trimmedStreamUrl\n"
                  "                                        } else {\n"
                  "                                            trimmedStreamUrl\n"
                  "                                        }\n"
                  "                                        ).toUri(),\n"
                  "                                ),\n"
                  "                            )"
              )
              assert s.count(old) == 1, "pattern not found in " + path
              s = s.replace(old, new).rstrip("\n") + "\n\nprivate const val ddStreamDownloadPrefix = \"https://ddstream.dpdns.org/download?path=\"\n"
              open(path, "w").write(s)
              print("patched:", path)
          EOF

      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew :app:assembleRelease-with-debug-signing

      - uses: actions/upload-artifact@v7
        with:
          name: nextplayer-32bit-release
          path: ./app/build/outputs/apk/release-with-debug-signing/*armeabi-v7a*.apk
