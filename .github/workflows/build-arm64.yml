name: Build arm64 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:assembleRelease-with-debug-signing
      - uses: actions/upload-artifact@v7
        with:
          name: nextplayer-arm64-release
          path: ./app/build/outputs/apk/release-with-debug-signing/*arm64-v8a*.apk
